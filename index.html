<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>СТ8 СТРОЙ | МАСТЕР AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СТ8 СТРОЙ">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root {
  --accent:#F5C518;--bg:#0c0c0c;--surface:#161616;--surface2:#202020;--surface3:#2a2a2a;
  --border:rgba(255,255,255,.08);--text:#f0f0f0;--text-muted:rgba(240,240,240,.45);--text-dim:rgba(240,240,240,.2);
  --font:'Inter',sans-serif;--font-hd:'Oswald',sans-serif;
  --header-h:58px;--bnav-h:64px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ═══ SPLASH ═══ */
#splash{position:fixed;inset:0;z-index:9999;background:#0c0c0c;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;}
#splash.fade{opacity:0;pointer-events:none;}
.sp-logo{font-family:var(--font-hd);font-size:2.8rem;font-weight:700;letter-spacing:.06em;margin-bottom:.1rem;}
.sp-logo span{color:var(--accent);}
.sp-sub{font-size:.62rem;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;margin-bottom:2.5rem;}
.sp-bar-wrap{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:.75rem;}
.sp-bar{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .15s;}
.sp-pct{font-size:.75rem;font-weight:700;color:var(--accent);}
.sp-hint{font-size:.6rem;color:rgba(240,240,240,.25);margin-top:2rem;letter-spacing:.1em;text-transform:uppercase;}

/* ═══ SHELL ═══ */
#app{display:none;min-height:100vh;flex-direction:column;}
header{position:sticky;top:0;z-index:100;background:rgba(12,12,12,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:var(--header-h);display:flex;align-items:center;padding:0 .875rem;gap:.6rem;}
.hd-brand{display:flex;flex-direction:column;flex-shrink:0;}
.hd-logo{font-family:var(--font-hd);font-size:.88rem;font-weight:700;letter-spacing:.08em;}
.hd-logo span{color:var(--accent);}
.hd-obj{font-size:.6rem;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;}
@media(min-width:600px){.hd-obj{max-width:180px;}}
.tab-nav{flex:1;display:flex;align-items:center;gap:.1rem;overflow-x:auto;scrollbar-width:none;}
.tab-nav::-webkit-scrollbar{display:none;}
@media(max-width:767px){.tab-nav{display:none;}}
.tab-btn{display:flex;align-items:center;gap:.25rem;padding:.32rem .5rem;border-radius:7px;border:none;background:transparent;color:var(--text-muted);font-size:.7rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);background:var(--surface2);}
.tab-btn.active{color:var(--accent);background:rgba(245,197,24,.1);}
.tab-btn .ti{font-size:.88rem;}
.tab-btn .tl{display:none;}
@media(min-width:900px){.tab-btn .tl{display:inline;}}
.hd-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
.master-online{font-size:.63rem;color:#22c55e;display:none;}
@media(min-width:640px){.master-online{display:block;}}
.settings-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;min-width:34px;height:34px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:background .2s;color:var(--text-muted);}
.settings-btn:hover{background:var(--surface3);color:var(--text);}

/* ═══ BOTTOM NAV (mobile) ═══ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(12,12,12,.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);}
@media(max-width:767px){.bottom-nav{display:flex;}}
.bn-items{display:flex;width:100%;overflow-x:auto;scrollbar-width:none;}
.bn-items::-webkit-scrollbar{display:none;}
.bn-btn{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.55rem .2rem;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:color .2s;font-size:.55rem;font-weight:500;min-height:var(--bnav-h);}
.bn-btn .bni{font-size:1.15rem;line-height:1;}
.bn-btn.active{color:var(--accent);}

/* ═══ CONTENT ═══ */
.content{flex:1;padding:1rem;max-width:1280px;width:100%;margin:0 auto;padding-bottom:calc(var(--bnav-h) + var(--safe-bottom) + .5rem);}
@media(min-width:768px){.content{padding:1.5rem;padding-bottom:1.5rem;}}

/* ═══ GREETING ═══ */
.greeting-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid rgba(245,197,24,.18);border-radius:12px;padding:.85rem 1rem;margin-bottom:.85rem;display:flex;align-items:flex-start;gap:.6rem;}
.gc-avatar{width:34px;height:34px;background:rgba(245,197,24,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.gc-text{font-size:.8rem;color:var(--text-muted);line-height:1.5;}
.gc-text strong{color:var(--text);font-weight:600;}

/* ═══ TABS ═══ */
.tab-panel{display:none;animation:fadeIn .25s ease;}
.tab-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* ═══ BUTTONS ═══ */
.btn{padding:.55rem 1.1rem;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;min-height:36px;}
.btn-accent{background:var(--accent);color:#0c0c0c;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);}
.btn-outline:hover{background:rgba(245,197,24,.1);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface3);}
.btn-danger{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}
.btn-danger:hover{background:rgba(239,68,68,.22);}
.btn-success{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.25);}
.btn-success:hover{background:rgba(34,197,94,.22);}
.import-label{display:inline-flex;align-items:center;gap:.3rem;padding:.55rem 1.1rem;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text);border:1px solid var(--border);white-space:nowrap;min-height:36px;}
.import-label:hover{background:var(--surface3);}
.import-label input{display:none;}

/* ═══ FORMS ═══ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;}
@media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:.28rem;}
.field label{font-size:.66rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:.5rem .7rem;color:var(--text);font-size:.83rem;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field-full{grid-column:1/-1;}
.field select option{background:var(--surface2);}
.field input[type=color]{height:36px;padding:3px;cursor:pointer;}
.field input[type=range]{accent-color:var(--accent);}

/* ═══ SECTION HEADER ═══ */
.sec-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.85rem;flex-wrap:wrap;}
.sec-hd h2{font-family:var(--font-hd);font-size:.96rem;font-weight:600;letter-spacing:.04em;padding-top:.1rem;}
.sec-hd .actions{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;}

/* ═══ CARDS / KPI ═══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.85rem;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;text-align:center;}
.kpi-val{font-size:1.5rem;font-weight:900;color:var(--accent);font-family:var(--font-hd);line-height:1.1;}
.kpi-lbl{font-size:.64rem;color:var(--text-muted);margin-top:.2rem;}

/* ═══ MOBILE CARDS ═══ */
@media(max-width:640px){
  .mobile-cards table,.mobile-cards thead{display:none;}
  .mobile-cards .tbl-wrap{border:none;overflow:visible;}
}
.mc-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:.5rem;}
.mc-title{font-size:.83rem;font-weight:700;margin-bottom:.35rem;}
.mc-row{display:flex;justify-content:space-between;font-size:.73rem;padding:.18rem 0;border-bottom:1px solid var(--border);}
.mc-row:last-of-type{border-bottom:none;}
.mc-lbl{color:var(--text-muted);}
.mc-actions{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap;}

/* ═══ TABLE ═══ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:480px;}
th{padding:.48rem .6rem;background:var(--surface);text-align:left;font-size:.65rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:.48rem .6rem;border-bottom:1px solid var(--border);vertical-align:middle;line-height:1.4;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}

/* ═══ BADGES ═══ */
.badge{display:inline-block;padding:.15rem .42rem;border-radius:4px;font-size:.64rem;font-weight:600;}
.badge-green{background:rgba(34,197,94,.13);color:#86efac;}
.badge-yellow{background:rgba(234,179,8,.13);color:#fde047;}
.badge-red{background:rgba(239,68,68,.13);color:#fca5a5;}
.badge-blue{background:rgba(96,165,250,.13);color:#93c5fd;}
.badge-accent{background:rgba(245,197,24,.13);color:var(--accent);}
.master-tip{font-size:.69rem;color:var(--accent);line-height:1.4;font-style:italic;}

/* ═══ MODAL ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:.75rem;overflow-y:auto;}
.modal-bg.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem;width:100%;max-width:600px;margin:auto;}
@media(max-width:480px){.modal{border-radius:12px;padding:1rem;}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;}
.modal-hd h2{font-family:var(--font-hd);font-size:.92rem;font-weight:600;letter-spacing:.04em;}
.close-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:.85rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.close-btn:hover{color:var(--text);background:var(--surface3);}
.ob-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.75rem;}

/* ═══ CHAT ═══ */
.chat-scenarios{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.8rem;}
.scenario-btn{padding:.3rem .7rem;background:var(--surface2);border:1px solid var(--border);border-radius:18px;font-size:.69rem;color:var(--text-muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.scenario-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(245,197,24,.06);}
.chat-messages{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-height:240px;max-height:400px;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;margin-bottom:.55rem;}
.msg{display:flex;gap:.48rem;max-width:92%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-avatar{width:26px;height:26px;border-radius:50%;background:rgba(245,197,24,.12);display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;margin-top:2px;}
.msg.user .msg-avatar{background:var(--surface3);}
.msg-bubble{background:var(--surface2);border-radius:10px;padding:.48rem .75rem;font-size:.8rem;line-height:1.55;}
.msg.user .msg-bubble{background:rgba(245,197,24,.12);}
.msg-actions{display:flex;gap:.28rem;margin-top:.28rem;flex-wrap:wrap;}
.ma-btn{padding:.18rem .48rem;border-radius:5px;font-size:.63rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);transition:all .2s;}
.ma-btn:hover{border-color:var(--accent);color:var(--accent);}
.thinking{font-size:.76rem;color:var(--text-dim);font-style:italic;padding:.4rem .75rem;}
.chat-input-area{display:flex;gap:.38rem;}
.chat-input-area textarea{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.52rem .7rem;color:var(--text);font-size:.83rem;resize:none;outline:none;transition:border-color .2s;min-height:44px;max-height:100px;line-height:1.4;}
.chat-input-area textarea:focus{border-color:var(--accent);}
.send-btn{background:var(--accent);color:#0c0c0c;border:none;border-radius:9px;width:44px;height:44px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;}
.send-btn:hover{filter:brightness(1.1);}
.warn-bar{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:.55rem .8rem;font-size:.76rem;color:#fca5a5;margin-bottom:.55rem;}

/* ═══ MISC ═══ */
.report-area{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem;font-size:.79rem;line-height:1.75;color:var(--text-muted);min-height:140px;white-space:pre-wrap;}
.search-bar{display:flex;gap:.4rem;margin-bottom:.8rem;}
.search-bar input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.46rem .7rem;color:var(--text);font-size:.8rem;outline:none;}
.search-bar input:focus{border-color:var(--accent);}
.source-tabs{display:flex;gap:.28rem;flex-wrap:wrap;margin-bottom:.65rem;}
.ct-btn{padding:.22rem .55rem;border-radius:5px;font-size:.67rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);transition:all .2s;}
.ct-btn.active{background:rgba(245,197,24,.12);border-color:var(--accent);color:var(--accent);}
.gap-sm{display:flex;gap:.38rem;flex-wrap:wrap;}
.mt-sm{margin-top:.55rem;}
.mt-md{margin-top:.9rem;}
.divider{height:1px;background:var(--border);margin:.9rem 0;}
.text-accent{color:var(--accent);}
.text-muted{color:var(--text-muted);}
.text-sm{font-size:.76rem;}
.font-bold{font-weight:700;}
.progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin:.3rem 0;}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
.mem-list{display:flex;flex-direction:column;gap:.25rem;max-height:90px;overflow-y:auto;margin-bottom:.35rem;}
.mem-item{display:flex;justify-content:space-between;align-items:flex-start;gap:.35rem;background:var(--surface2);border-radius:5px;padding:.28rem .48rem;font-size:.69rem;}
.mem-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.78rem;}
.mem-del:hover{color:#ef4444;}
.mem-section{margin-top:.8rem;}
.mem-section h4{font-size:.67rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.32rem;}

/* ═══ SMETA ═══ */
.smeta-grid{display:grid;grid-template-columns:1fr;gap:.9rem;}
@media(min-width:768px){.smeta-grid{grid-template-columns:1fr 1fr;}}
.smeta-result{background:var(--surface);border:1px solid rgba(245,197,24,.22);border-radius:12px;padding:1.2rem;}
.smeta-total{font-size:1.9rem;font-weight:900;color:var(--accent);margin:.3rem 0;font-family:var(--font-hd);}
.smeta-row{display:flex;justify-content:space-between;align-items:center;padding:.38rem 0;border-bottom:1px solid var(--border);font-size:.78rem;}
.smeta-row:last-child{border-bottom:none;}
.smeta-row .rv{font-weight:700;color:var(--accent);}
.slider-field{margin-bottom:.8rem;}
.slider-field label{font-size:.71rem;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:.28rem;}
.slider-field input[type=range]{width:100%;}

/* ═══ КС-2 ДОКУМЕНТ (для печати и экрана) ═══ */
.ks2-doc{background:#fff;color:#000;border-radius:10px;padding:1.5rem;font-size:.82rem;line-height:1.6;border:1px solid var(--border);}
.ks2-header{text-align:center;margin-bottom:1rem;}
.ks2-header h3{font-size:1rem;font-weight:700;margin-bottom:.25rem;}
.ks2-header p{font-size:.75rem;color:#444;}
.ks2-reqs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem;font-size:.75rem;}
.ks2-req-block{border:1px solid #ccc;padding:.5rem;border-radius:4px;}
.ks2-req-block strong{display:block;font-size:.68rem;color:#666;margin-bottom:.2rem;}
.ks2-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.75rem;}
.ks2-table th,.ks2-table td{border:1px solid #999;padding:.35rem .5rem;text-align:left;vertical-align:top;}
.ks2-table th{background:#f0f0f0;font-weight:700;font-size:.68rem;text-align:center;}
.ks2-table td{text-align:center;}
.ks2-table td:nth-child(2){text-align:left;}
.ks2-total{text-align:right;font-weight:700;font-size:.85rem;margin:.5rem 0;}
.ks2-sigs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;font-size:.75rem;}
.ks2-sig-block{border-top:1px solid #000;padding-top:.5rem;}
.ks2-sig-block strong{display:block;font-size:.7rem;color:#555;margin-bottom:.75rem;}
.ks2-sig-line{border-bottom:1px solid #999;height:1.5rem;margin-bottom:.25rem;}
.ks2-sig-caption{font-size:.65rem;color:#666;text-align:center;}

/* ═══ КАЛЬКУЛЯТОР ═══ */
.calc-grid{display:grid;grid-template-columns:1fr;gap:.65rem;}
@media(min-width:600px){.calc-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1000px){.calc-grid{grid-template-columns:1fr 1fr 1fr;}}
.calc-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem;}
.calc-card h4{font-family:var(--font-hd);font-size:.82rem;font-weight:600;letter-spacing:.04em;margin-bottom:.7rem;}
.calc-result{background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.2);border-radius:7px;padding:.6rem .8rem;margin-top:.65rem;font-size:.79rem;line-height:1.5;color:var(--accent);font-weight:600;min-height:42px;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px;}

/* ═══════════════════════════════════════
   ✅ УЛУЧШЕНИЕ 5: PRINT CSS
   Нормальная печать документов
═══════════════════════════════════════ */
@media print {
  /* Скрываем интерфейс */
  #splash, header, .bottom-nav,
  .chat-scenarios, .settings-btn, .warn-bar,
  .sec-hd .actions, .gap-sm, .tab-nav,
  .btn-accent, .btn-outline, .btn-ghost, .btn-danger,
  .import-label, .search-bar, .source-tabs,
  .scenario-btn, .chat-input-area,
  #panel-master, #panel-naryady, #panel-mats,
  #panel-brig, #panel-calc, #panel-analytics,
  #panel-smeta { display:none !important; }

  body { background:#fff !important; color:#000 !important; font-size:11pt; }
  .content { padding:0 !important; max-width:100% !important; padding-bottom:0 !important; }
  .tab-panel { display:block !important; }
  .tab-panel:not(.active) { display:none !important; }

  /* Документы для печати */
  .ks2-doc { border:none !important; padding:0 !important; }

// ══════ INIT ══════
function showSplash(cb){
  const bar=document.getElementById('sp-bar'),pct=document.getElementById('sp-pct'),sp=document.getElementById('splash');
  let p=0;const steps=[[300,30],[200,65],[150,88],[100,100]];let i=0;
  function next(){if(i>=steps.length){setTimeout(()=>{sp.classList.add('fade');setTimeout(()=>{sp.style.display='none';cb();},500);},200);return;}const[delay,target]=steps[i++];const inc=(target-p)/(delay/16);const tick=setInterval(()=>{p=Math.min(p+inc,target);bar.style.width=p+'%';pct.textContent=Math.round(p)+'%';if(p>=target){clearInterval(tick);setTimeout(next,80);}},16);}
  next();
}
function init(){applyAcc();updateDays();showSplash(showApp);}
function applyAcc(){document.documentElement.style.setProperty('--accent',cfg.acc||'#F5C518');}
function updateDays(){const t=new Date().toDateString();if(mem.lastV!==t){mem.days=(mem.days||0)+1;mem.lastV=t;S.set('s_mem',mem);}}

function buildGreeting(){

function buildTabs(){
  document.getElementById('tab-nav').innerHTML=TABS.map(t=>`<button class="tab-btn" id="tb-${t.id}" onclick="switchTab('${t.id}')"><span class="ti">${t.ico}</span><span class="tl">${t.lbl}</span></button>`).join('');

function switchTab(id){

const H=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const A=s=>String(s).replace(/'/g,"\\'").replace(/\n/g,' ');
const fmt=v=>Number(v||0).toLocaleString('ru');
const now=()=>new Date().toISOString().slice(0,10);
const hideM=id=>document.getElementById(id)?.classList.add('hidden');
const copyReport=sel=>{const el=document.querySelector(sel);if(!el)return;navigator.clipboard.writeText(el.innerText||el.textContent).then(()=>alert('Скопировано!'));};

// ══════ AI HELPERS ══════
async function aiCall(prompt,max=900){
  const key=S.raw('st8_api_key');if(!key)throw new Error('Нужен API ключ');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:max,system:SP(),messages:[{role:'user',content:prompt}]})});
  if(!r.ok){const e=await r.text();throw new Error(e.slice(0,120));}
  const d=await r.json();return d.content?.[0]?.text||'';
}

async function parseJSON(key,text,prompt){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,system:'Отвечай только JSON массивом без пояснений и markdown.',messages:[{role:'user',content:prompt+'\n\nДанные:\n'+text.slice(0,3000)}]})});
  const d=await r.json();const raw=d.content?.[0]?.text||'';
  const m=raw.match(/\[[\s\S]*\]/);if(!m)throw new Error('Не удалось распознать данные');
  return JSON.parse(m[0]);
}

function readFile(file,cb){
  if(!file)return;const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const texts=wb.SheetNames.map(sn=>{const ws=wb.Sheets[sn];return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(row=>row.filter(c=>c!=='').join('\t')).filter(r=>r.trim()).join('\n');}).join('\n---\n');cb(texts);};r.readAsArrayBuffer(file);}
  else{const r=new FileReader();r.onload=e=>{const buf=e.target.result;let text=new TextDecoder('utf-8',{fatal:false}).decode(buf);if((text.match(/�/g)||[]).length>5)text=new TextDecoder('windows-1251').decode(buf);cb(text);};r.readAsArrayBuffer(file);}
}

// ══════ PANEL: МАСТЕР ══════
function panelMaster(){
  const hasKey=!!S.raw('st8_api_key');
  return`
    ${!hasKey?`<div class="warn-bar">⚠️ API ключ не указан. <a href="#" onclick="openSettings();return false;" style="color:var(--accent)">Добавьте в настройках →</a></div>`:''}

        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send-btn" onclick="sendMsg()">↑</button>
    </div>`;
}

function renderMsgs(){
  if(!chat.length)return'<div style="color:var(--text-dim);font-size:.78rem;text-align:center;padding:2rem">Начните диалог с МАСТЕРОМ</div>';
  return chat.map((m,i)=>{
    const u=m.role==='user',isLast=!u&&i===chat.length-1;
    return`<div class="msg ${u?'user':''}"><div class="msg-avatar">${u?'👷':'🦺'}</div><div><div class="msg-bubble">${H(m.content)}</div>${isLast?`<div class="msg-actions"><button class="ma-btn" onclick="memFb('wins',${i})">✅ Сработало</button><button class="ma-btn" onclick="memFb('fails',${i})">❌ Не подходит</button><button class="ma-btn" onclick="memFb('notes',${i})">📝 Заметка</button></div>`:''}</div></div>`;
  }).join('');
}
function scrollChat(){const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight;}
function sendMsg(){const inp=document.getElementById('chat-inp');if(!inp)return;const t=inp.value.trim();if(!t)return;inp.value='';inp.style.height='auto';doMsg(t);}
async function doMsg(text){
  const key=S.raw('st8_api_key');if(!key){openSettings();return;}
  chat.push({role:'user',content:text});S.set('s_chat',chat.slice(-20));
  const msgs=document.getElementById('chat-msgs');
  if(msgs){msgs.innerHTML=renderMsgs();scrollChat();const th=document.createElement('div');th.className='thinking';th.id='thinking';th.textContent='МАСТЕР думает...';msgs.appendChild(th);scrollChat();}
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,system:SP(),messages:chat.slice(-12).map(m=>({role:m.role,content:m.content}))})});
    document.getElementById('thinking')?.remove();
    if(!r.ok){const e=await r.text();throw new Error(e.slice(0,120));}
    const d=await r.json();const reply=d.content?.[0]?.text||'Ошибка ответа';
    chat.push({role:'assistant',content:reply});S.set('s_chat',chat.slice(-20));
  }catch(e){document.getElementById('thinking')?.remove();chat.push({role:'assistant',content:`Ошибка: ${e.message}`});}
  if(msgs){msgs.innerHTML=renderMsgs();scrollChat();}
}
function memFb(type,idx){const short=(chat[idx]?.content||'').slice(0,80);mem[type].push(short);S.set('s_mem',mem);alert(type==='wins'?'✅ Сработало':type==='fails'?'❌ Не работает':'📝 Заметка сохранена');}

// ══════════════════════════════════════════════════════

function panelNaryady(){

      ${n.volume?`<div class="mc-row"><span class="mc-lbl">Объём</span><span>${H(n.volume)}</span></div>`:''}
      <div class="mc-actions">
        <button class="btn btn-ghost" style="font-size:.68rem;padding:.2rem .5rem" onclick="genAkt(${i})">📋 КС-2</button>
        <button class="btn btn-ghost" style="font-size:.68rem;padding:.2rem .5rem" onclick="changeNarStatus(${i})">🔄</button>
        <button class="btn btn-danger" style="font-size:.68rem;padding:.2rem .5rem" onclick="delNar(${i})">✕</button>
      </div>
    </div>`;
  }).join('')||'<div class="text-muted text-sm" style="text-align:center;padding:2rem">Нарядов нет</div>';

  // Выпадающий список объектов для фильтра
  const objFilter=objects.length?`<select onchange="filterByObj(this.value)" style="background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.38rem .65rem;color:var(--text);font-size:.78rem;outline:none;"><option value="">Все объекты</option>${objects.map(o=>`<option value="${o.id}">${H(o.name)}</option>`).join('')}</select>`:'';

  return`
    <div class="sec-hd"><h2>📋 Наряды</h2>
      <div class="actions">
        ${objFilter}
        <label class="import-label">📂<input type="file" accept=".xlsx,.xls,.csv,.txt" onchange="importNaryady(this)"></label>

      </div>
    </div>
    <div id="mc-nar" class="mobile-cards">${rows}</div>
    <div id="nar-res" class="mt-sm"></div>

    <div class="modal-bg hidden" id="nm">
      <div class="modal">

async function aiGenNar(){

  const el=document.getElementById('ng-res');el.innerHTML='<div class="thinking">МАСТЕР формирует наряд...</div>';
  try{

async function importNaryady(input){
  const f=input.files[0];if(!f)return;input.value='';
  const key=S.raw('st8_api_key');if(!key){alert('Нужен API ключ');return;}
  readFile(f,async text=>{
    try{
      const items=await parseJSON(key,text,'Извлеки список нарядов. JSON: [{title,brigade,startDate,volume,unit,price,sum,status}]. startDate=YYYY-MM-DD, status="draft"|"active"|"done". Макс 50.');
      items.forEach(it=>naryady.push({id:'n'+Date.now()+Math.random(),objectId:'',...it}));
      S.set('s_nar',naryady);alert(`✅ Импортировано ${items.length} нарядов`);
      document.getElementById('panel-naryady').innerHTML=panelNaryady();
    }catch(e){alert('Ошибка: '+e.message);}
  });
}

function calcConcrete(){const l=+document.getElementById('c-bl').value||0,w=+document.getElementById('c-bw').value||0,h=+document.getElementById('c-bh').value||0,m=document.getElementById('c-bm').value,el=document.getElementById('r-concrete');if(!l||!w||!h){el.textContent='Введите размеры';return;}const vol=(l*w*h).toFixed(3),cement={200:240,300:310,400:370}[m]||310,bags=Math.ceil(+vol*cement/50),sand=Math.round(+vol*0.62*1000)/1000,gravel=Math.round(+vol*0.85*1000)/1000;el.innerHTML=`Объём: <strong>${vol} м³</strong><br>Цемент М${m}: ~${bags} мешков (${Math.round(+vol*cement)} кг)<br>Песок: ~${sand} м³<br>Щебень: ~${gravel} м³`;}
function calcBrick(){const area=+document.getElementById('c-kl').value||0,thick=+document.getElementById('c-kt').value||0.5,base=51,br=+document.getElementById('c-kbr').value||5,el=document.getElementById('r-brick');if(!area){el.textContent='Введите площадь';return;}const perM2=Math.round(base*thick*2),qty=Math.ceil(area*perM2*(1+br/100)),mortar=(area*thick*0.25*0.3).toFixed(2);el.innerHTML=`Кирпичей: <strong>${fmt(qty)} шт</strong><br>Раствор: ~${mortar} м³<br>Расход: ${perM2} шт/м²`;}
function calcPlaster(){const area=+document.getElementById('c-pl').value||0,thick=+document.getElementById('c-pt').value||20,rate=+document.getElementById('c-pkg').value||8.5,bag=+document.getElementById('c-pbag').value||30,el=document.getElementById('r-plaster');if(!area){el.textContent='Введите площадь';return;}const kgTotal=Math.ceil(area*(rate/10)*thick),bags=Math.ceil(kgTotal/bag);el.innerHTML=`Смеси: <strong>${fmt(kgTotal)} кг</strong><br>Мешков ${bag}кг: ~<strong>${bags} шт</strong>`;}
function calcTile(){const area=+document.getElementById('c-tl').value||0,w=+document.getElementById('c-tw').value||600,h=+document.getElementById('c-th').value||600,br=+document.getElementById('c-tbr').value||10,el=document.getElementById('r-tile');if(!area||!w||!h){el.textContent='Введите данные';return;}const perM2=1/((w/1000)*(h/1000)),qty=Math.ceil(area*perM2*(1+br/100));el.innerHTML=`Плиток: <strong>${fmt(qty)} шт</strong><br>Расход: ${perM2.toFixed(1)} шт/м²<br>Запас ${br}%: ${Math.ceil(area*perM2*br/100)} шт`;}
function calcPaint(){const area=+document.getElementById('c-pal').value||0,layers=+document.getElementById('c-play').value||2,rate=+document.getElementById('c-prate').value||12,vol=+document.getElementById('c-pvol').value||10,el=document.getElementById('r-paint');if(!area){el.textContent='Введите площадь';return;}const liters=Math.ceil(area*layers/rate),cans=Math.ceil(liters/vol);el.innerHTML=`Краски: <strong>${liters} л</strong><br>Банок по ${vol}л: <strong>${cans} шт</strong>`;}
function calcWage(){const workers=+document.getElementById('c-ww').value||0,daily=+document.getElementById('c-wd').value||0,days=+document.getElementById('c-wdys').value||0,bonus=+document.getElementById('c-wbonus').value||0,el=document.getElementById('r-wage');if(!workers||!daily||!days){el.textContent='Введите данные';return;}const base=workers*daily*days,total=Math.round(base*(1+bonus/100)),ndfl=Math.round(total*0.13);el.innerHTML=`ФОТ (на руки): <strong>${fmt(total)} ₽</strong><br>НДФЛ 13%: ${fmt(ndfl)} ₽<br>${workers} чел × ${daily} ₽/день × ${days} дней`;}
async function aiCalc(){const text=document.getElementById('c-ai').value.trim();if(!text){alert('Опишите задачу');return;}const key=S.raw('st8_api_key');if(!key){alert('Нужен API ключ');return;}const el=document.getElementById('r-ai');el.innerHTML='<div class="thinking">МАСТЕР считает...</div>';try{const r=await aiCall(`Рассчитай объёмы и количество материалов. Дай конкретные цифры с формулами. Ссылайся на нормы (ЕНиР, ГЭСН, СНиП). Задача: ${text}`);el.innerHTML=`<div class="card"><div class="master-tip" style="font-style:normal">${H(r)}</div></div><div class="gap-sm mt-sm"><button class="btn btn-outline" onclick="copyReport('#r-ai .master-tip')">📋 Копировать</button></div>`;}catch(e){el.innerHTML=`<p style="color:#fca5a5">Ошибка: ${e.message}</p>`;}}

function ks6FillFromNar(narId){
  const n=naryady.find(n=>n.id===narId);if(!n)return;
  if(n.unit) document.getElementById('ks6-u').value=n.unit.split(',')[0];
  if(n.price) document.getElementById('ks6-p').value=n.price;
  if(n.objectId){const sel=document.getElementById('ks6-oid');if(sel)sel.value=n.objectId;}
}

function calcKS6Total(){
  const q=+document.getElementById('ks6-q').value||0;
  const prev=ks6a.filter(r=>r.narId===document.getElementById('ks6-nid').value).reduce((s,r)=>s+(+r.qty||0),0);
  document.getElementById('ks6-qt').value=prev+q;
  calcKS6Sum();
}

function calcKS6Sum(){
  const q=+document.getElementById('ks6-q').value||0;
  const p=+document.getElementById('ks6-p').value||0;
  if(q&&p) document.getElementById('ks6-s').value=Math.round(q*p);
}

function saveKS6A(){
  const d=document.getElementById('ks6-d').value;if(!d){alert('Укажите дату');return;}
  const narId=document.getElementById('ks6-nid').value;
  const narTitle=naryady.find(n=>n.id===narId)?.title||'';
  ks6a.push({
    date:d,
    objId:document.getElementById('ks6-oid').value,
    narId,narTitle,
    workDesc:document.getElementById('ks6-wd').value,
    unit:document.getElementById('ks6-u').value,
    qty:+document.getElementById('ks6-q').value||0,
    qtyTotal:+document.getElementById('ks6-qt').value||0,
    price:+document.getElementById('ks6-p').value||0,
    sum:+document.getElementById('ks6-s').value||0,
  });
  S.set('s_ks6a',ks6a);hideM('ks6-m');document.getElementById('j-content').innerHTML=renderJ();
}

function delKS6A(i){ks6a.splice(i,1);S.set('s_ks6a',ks6a);document.getElementById('j-content').innerHTML=renderJ();}

async function importKS6A(input){
  const f=input.files[0];if(!f)return;input.value='';
  const key=S.raw('st8_api_key');if(!key){alert('Нужен API ключ');return;}
  readFile(f,async text=>{
    try{
      const items=await parseJSON(key,text,'Извлеки записи КС-6а (журнал учёта выполненных работ). JSON: [{date,narTitle,workDesc,unit,qty,qtyTotal,price,sum}]. date=YYYY-MM-DD, qty и sum=числа. Макс 200.');
      items.forEach(it=>ks6a.push({...it,objId:'',narId:''}));
      S.set('s_ks6a',ks6a);alert(`✅ Импортировано ${items.length} записей`);
      document.getElementById('j-content').innerHTML=renderJ();
    }catch(e){alert('Ошибка: '+e.message);}
  });
}

async function sendToAgent(i){
  const obj=objects[i];if(!obj)return;
  const url=(cfg.agentUrl||'http://localhost:8000').replace(/\/$/,'');
  const resEl=document.getElementById('obj-res-'+i);
  const body={company:obj.client||obj.name,contact:obj.name,industry:'Строительство',scale:obj.budget?`Бюджет ${fmt(obj.budget)} ₽`:'—',pain:`Объект: ${obj.name}. Адрес: ${obj.address||'—'}. Дедлайн: ${obj.deadline||'—'}.`,market:'ru',contact_emails:[]};
  if(resEl)resEl.innerHTML='<div class="thinking" style="margin-top:.5rem">⏳ Агенты работают — обычно 1–2 мин...</div>';
  let leadId;
  try{
    const r=await fetch(url+'/lead/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    leadId=(await r.json()).lead_id;
  }catch(e){
    if(resEl)resEl.innerHTML=`<p style="color:#fca5a5;font-size:.76rem;margin-top:.5rem">Ошибка: ${e.message}<br>Проверьте autopilot на ${url}</p>`;
    return;
  }
  let attempts=0;
  const poll=setInterval(async()=>{
    if(++attempts>24){clearInterval(poll);if(resEl)resEl.innerHTML='<p style="color:#fca5a5;font-size:.76rem;margin-top:.5rem">Таймаут — агент не ответил за 2 мин</p>';return;}
    try{
      const d=await(await fetch(url+'/lead/'+leadId+'?t='+Date.now())).json();
      if(d.status==='ready'||d.status==='filtered'){
        clearInterval(poll);
        if(!resEl)return;
        if(d.status==='filtered'){resEl.innerHTML='<div style="color:#fca5a5;font-size:.76rem;margin-top:.5rem">🔴 Лид не прошёл ICP фильтр</div>';return;}
        const kp=d.kp||'КП не сгенерировано';
        const score=d.score?.score||'—';
        const kpEsc=kp.replace(/\\/g,'\\\\').replace(/`/g,'\\`');
        resEl.innerHTML=`<div style="margin-top:.6rem;background:rgba(245,197,24,.06);border:1px solid rgba(245,197,24,.2);border-radius:8px;padding:.7rem .85rem">
          <div style="font-size:.69rem;color:var(--accent);font-weight:700;margin-bottom:.4rem">🤖 КП от агента · Score: ${score}/100</div>
          <div style="font-size:.76rem;line-height:1.6;color:var(--text);white-space:pre-wrap;max-height:200px;overflow-y:auto">${H(kp)}</div>
          <div class="gap-sm" style="margin-top:.5rem">
            <button class="btn btn-outline" style="font-size:.66rem;padding:.2rem .5rem" onclick="navigator.clipboard.writeText(\`${kpEsc}\`).then(()=>alert('Скопировано!'))">📋 Копировать КП</button>
          </div></div>`;
      }
    }catch(e){}
  },5000);
}
function resetAll(){if(!confirm('Сбросить ВСЕ данные?'))return;localStorage.clear();location.reload();}

// ══════ BOOT ══════
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
